    if (key === "extsys") return { pt: calc.extsys.pt, min: calc.extsys.min, max: calc.extsys.max };
    if (key === "suf") return { pt: calc.suf.pt, min: calc.suf.b.min, max: calc.suf.b.max };
    if (key === "perte") return basis === "si" ? { pt: calc.perte.pty, min: calc.perte.by.min, max: calc.perte.by.max } : { pt: calc.perte.pt, min: calc.perte.b.min, max: calc.perte.b.max };
    if (basis === "si") return { pt: calc.oy[key], min: calc.by[key].min, max: calc.by[key].max };
    return { pt: calc.o[key], min: calc.b[key].min, max: calc.b[key].max };
  }
  function renderLit() {
    var hasState = !!state;
    $("lit-recent").checked = ui.litRecent;
    $("lit-grid").innerHTML = LIT.map(function (L) {
      var c = L.c || (BY[L.key] ? colorOf(L.key) : "var(--accent)");
      var refs = L.refs.filter(function (r) { return !ui.litRecent || r.period === "recent"; });
      var bases = {}; L.refs.forEach(function (r) { bases[r.basis] = true; });
      var you = "";
      if (hasState) {
        ["abs", "si"].forEach(function (bs) {
          if (!bases[bs]) return;
          var u = userVal(L.key, bs), lo = lpos(u.min * 100), hi = lpos(u.max * 100);
          you += '<i class="lyou-band" style="--c:' + c + ";left:" + lo + "%;width:" + Math.max(0, hi - lo) + "%" + (bs === "si" ? ";opacity:.18" : "") + '"></i>' +
                 '<i class="lyou-dot" style="--c:' + c + ";left:" + lpos(u.pt * 100) + "%" + (bs === "si" ? ";background:var(--surface);border:2.5px solid " + c : "") + '" title="Vous, ' + (bs === "si" ? "sachant la SI" : "inconditionnelle") + " : " + pct(u.pt * 100) + '"></i>';
        });
      }
      var marks = refs.map(function (r) { return '<i class="lmark ' + (r.period === "recent" ? "recent" : r.period === "2023" ? "y2023" : "old") + '" style="left:' + lpos(r.v) + '%" title="' + esc(r.label) + " : " + esc(String(r.v).replace(".", ",")) + ' %"></i>'; }).join("");
      var youLine = "";
      if (hasState) {
        youLine = '<p class="lctx"><strong>Vous :</strong> ' + ["abs", "si"].filter(function (bs) { return bases[bs]; }).map(function (bs) {
          var u = userVal(L.key, bs); return (bs === "si" ? "sachant la SI " : "inconditionnelle ") + pct(u.pt * 100) + " " + rngPB(u);
        }).join(" · ") + (bases.si && bases.abs ? " (cercle plein : inconditionnelle ; cercle creux : sachant la SI)" : "") + "</p>";
      }
      return '<article class="lit-card"><h3><span class="sw" style="--c:' + c + '"></span>' + esc(L.title || BY[L.key].name) + "</h3>" +
        '<div class="ltrack">' + you + marks + '</div><div class="axis" aria-hidden="true"><span style="left:0">0,1 %</span><span style="left:33.33%">1 %</span><span style="left:66.67%">10 %</span><span style="left:100%">100 %</span></div>' +
        youLine +
        (refs.length ? '<ul class="lrefs">' + refs.map(function (r) {
          return '<li><span class="lm"><i class="lmark ' + (r.period === "recent" ? "recent" : r.period === "2023" ? "y2023" : "old") + '" style="left:50%"></i></span><span>' + esc(r.label) + ' <span class="tag' + (r.period === "recent" ? " recent" : "") + '">' + esc(r.date) + '</span></span><span class="lv">' + esc(String(r.v).replace(".", ",")) + NN + '%</span><span class="lnote">' + esc(r.note) + (r.basis === "si" ? " Probabilité conditionnelle : comparez-la à votre valeur sachant la SI." : "") + "</span></li>";
        }).join("") + "</ul>" : '<p class="lctx">' + (L.refs.length ? "Aucune prévision récente." : "Aucune prévision chiffrée publiée, à notre connaissance.") + "</p>") +
        (L.ctx ? '<p class="lctx">' + esc(L.ctx) + "</p>" : "") + "</article>";
    }).join("");
  }

  // ---- Résumé ----
  function renderSummary() {
    var lines = [];
    lines.push("Arbre des futurs de l'IA, édition 2.1 (26 octobre 2026). Empreinte de référence : " + AUTH_REF.slice(0, 16) + "…");
    lines.push("Point de départ : " + (PRESETS[state.preset] ? PRESETS[state.preset].name : "valeurs personnelles") + ".");
    lines.push("");
    lines.push("Probabilités conditionnelles (verrou entre crochets) :");
    M.ORDER.forEach(function (n) {
      lines.push("- " + NODEDEF[n].num + " — " + NODEDEF[n].q);
      M.NODES[n].br.forEach(function (b, i) {
        var lk = state.locks[n][i];
        lines.push("    " + NODEDEF[n].labels[i] + " : " + fmtSlider(state.vals[n][i]) + (lk.t === "point" ? " [valeur verrouillée]" : lk.t === "interval" ? " [entre " + fmtSlider(lk.lo) + " et " + fmtSlider(lk.hi) + "]" : ""));
      });
    });
    lines.push("");
    lines.push("Issues d'ici 2100, probabilité inconditionnelle, point [intervalle] :");
    OUT.forEach(function (o) { lines.push("- " + o.name + " : " + pct(calc.o[o.id] * 100) + " " + rng(calc.b[o.id])); });
    lines.push("- Perte de pouvoir de l'espèce (agrégat) : " + pct(calc.perte.pt * 100) + " " + rng(calc.perte.b));
    lines.push("- Superintelligence d'ici 2100 : " + pct(calc.si.pt * 100) + " ; systèmes qui s'orientent eux-mêmes : " + pct(calc.sys.pt * 100));
    lines.push("- Couche Souffrance, risque total : " + pct(calc.suf.pt * 100) + " " + rng(calc.suf.b));
    lines.push("");
    lines.push("Paliers de désirabilité (proposés) : " + TIER_ORDER.map(function (t) { return TIERS[t].short + " " + pct(calc.tiers[t].pt * 100); }).join(" · "));
    lines.push("Paramètres fixés : " + M.fixedParams(state.locks) + " sur " + M.totalParams() + ".");
    $("sum-text").value = lines.join("\n");
  }

  // ---- Mise à jour ----
  function update() {
    compute();
    renderPresetBar(); renderTree(); renderGuideLive(); renderBilan(); renderRanges(); renderTiers(); renderWorlds(); renderLevers(); renderSuf(); renderLit(); renderSummary();
    save();
  }
  function showApp() {
    $("bilan").hidden = false; $("main-grid").hidden = false;
    $("start").querySelector(".sec-title").textContent = "Changer de point de départ";
    if (!$("tree").firstChild) { $("tree").appendChild(buildNode("n1", "", true)); wireTree($("tree")); wireGuide(); }
    if (!Array.isArray(ui.done)) ui.done = [];
    ui.step = Math.max(0, Math.min(GUIDE_ORDER.length - 1, Math.round(+ui.step) || 0));
    if (ui.mode !== "tree") ui.mode = "guide";
    applyMode();
    update();
  }

  // ---- Commandes générales ----
  function wireGlobal() {
    $("presets").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.id === "unlock-all") { state.locks = noLocks(); update(); return; }
      if (b.dataset.preset) { state = fromPreset(b.dataset.preset); update(); }
    });
    $("view-ctl").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; ui.view = b.dataset.view; renderRanges(); save(); });
    $("bilan-toggle").addEventListener("click", function () { ui.collapsed = !ui.collapsed; renderBilan(); save(); });
    $("lit-recent").addEventListener("change", function (e) { ui.litRecent = e.target.checked; renderLit(); save(); });
    $("copy-sum").addEventListener("click", function () {
      var t = $("sum-text"), msg = $("copy-msg");
      function fallback() { t.focus(); t.select(); msg.textContent = "Texte sélectionné : copiez-le avec votre clavier."; }
      try { navigator.clipboard.writeText(t.value).then(function () { msg.textContent = "Résumé copié."; }, fallback); } catch (e) { fallback(); }
    });
  }

  // ---- Authenticité ----
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function renderAuth() {
    $("auth-date").textContent = "26 octobre 2026";
    $("auth-url").innerHTML = AUTH_META.url ? '<a href="' + esc(AUTH_META.url) + '" target="_blank" rel="noopener">' + esc(AUTH_META.url) + "</a>" : "lien inséré après la première publication";
    $("auth-ref").textContent = AUTH_REF;
    var badge = $("auth-badge");
    try {
      crypto.subtle.digest("SHA-256", new TextEncoder().encode(CONTENT_JSON)).then(function (buf) {
        var h = hex(buf), ok = h === AUTH_REF;
        $("auth-live").textContent = h;
        $("auth-status").innerHTML = ok ? "<strong>Conforme</strong> : le contenu de cette page est identique à celui de l'édition de référence. Pour exclure une contrefaçon, comparez aussi avec l'empreinte publiée par Louis."
          : "<strong>Modifié</strong> : le contenu diffère de l'édition de référence. Cette page est une copie modifiée ou une autre édition.";
        badge.textContent = ok ? "édition de référence, contenu conforme" : "contenu modifié par rapport à l'édition de référence";
      }, function () { $("auth-live").textContent = "calcul impossible dans ce navigateur"; badge.textContent = "authenticité : voir la section"; });
    } catch (e) { $("auth-live").textContent = "calcul impossible dans ce navigateur"; badge.textContent = "authenticité : voir la section"; }
  }

  // ---- Navigation : liens internes, retour à l'emplacement précédent, haut de page ----
  var navStack = [];
  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { }
  function topOffset() { var b = $("bilan"); return (b && !b.hidden ? b.offsetHeight : 0) + 12; }
  function scrollToY(y) { window.scrollTo({ top: Math.max(0, y), behavior: reduced ? "auto" : "smooth" }); }
  function goTo(el) {
    var d = el.closest("details");
    while (d) { d.open = true; d = d.parentElement ? d.parentElement.closest("details") : null; }
    scrollToY(el.getBoundingClientRect().top + window.scrollY - topOffset());
  }
  function updateFab() {
    $("nav-back").hidden = navStack.length === 0;
    $("nav-top").hidden = window.scrollY < 500;
  }
  function wireNav() {
    document.addEventListener("click", function (e) {
      var a = e.target.closest('a[href^="#"]'); if (!a) return;
      var id = a.getAttribute("href").slice(1), t = id ? document.getElementById(id) : null;
      if (id.indexOf("node-") === 0 && ui.mode === "guide" && GUIDE_ORDER.indexOf(id.slice(5)) >= 0) { e.preventDefault(); setStep(GUIDE_ORDER.indexOf(id.slice(5))); return; }
      if (!t) return;
      e.preventDefault();
      navStack.push(window.scrollY); if (navStack.length > 30) navStack.shift();
      goTo(t); updateFab();
    });
    $("nav-back").addEventListener("click", function () { var y = navStack.pop(); if (y !== undefined) scrollToY(y); updateFab(); });
    $("nav-top").addEventListener("click", function () { navStack.push(window.scrollY); scrollToY(0); updateFab(); });
    var ticking = false;
    window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; updateFab(); }); } }, { passive: true });
    updateFab();
  }

  // ---- Démarrage ----
  renderStatic();
  wireGlobal();
  wireNav();
  renderAuth();
  if (state) showApp(); else renderLit();
})();

</script>
